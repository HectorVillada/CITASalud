<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Citas Médicas</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f3f4f6;
        }
        .container {
            max-width: 900px;
        }
        .form-container {
            background-color: white;
            padding: 2.5rem;
            border-radius: 1rem;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
            margin-top: 2rem;
        }
        .step-heading {
            border-bottom: 2px solid #e5e7eb;
            padding-bottom: 0.5rem;
            margin-bottom: 1.5rem;
        }
        .btn-primary {
            @apply bg-blue-600 text-white font-semibold py-2 px-6 rounded-lg shadow-md transition-all duration-300 ease-in-out hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2;
        }
        .btn-secondary {
            @apply bg-gray-200 text-gray-800 font-semibold py-2 px-6 rounded-lg transition-all duration-300 ease-in-out hover:bg-gray-300 focus:outline-none focus:ring-2 focus:ring-gray-400 focus:ring-offset-2;
        }
        .loader {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #3b82f6;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        /* Estilos para el modal */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal-content {
            background-color: white;
            padding: 2rem;
            border-radius: 0.75rem;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
            max-width: 400px;
            width: 100%;
            text-align: center;
        }
        .modal-buttons {
            display: flex;
            gap: 1rem;
            justify-content: center;
            margin-top: 1.5rem;
        }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-4 sm:p-6">

<div id="app-container" class="container w-full mx-auto">
    <!-- Pantalla de Inicio de Sesión -->
    <div id="login-screen" class="form-container">
        <h2 class="text-3xl font-bold mb-6 text-center text-gray-800">Iniciar Sesión</h2>
        <form id="login-form" class="space-y-4">
            <div>
                <label for="cedula" class="block text-sm font-medium text-gray-700">Usuario</label>
                <input type="text" id="cedula" placeholder="Usuario" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 p-2 border">
            </div>
            <div>
                <label for="password" class="block text-sm font-medium text-gray-700">Contraseña</label>
                <input type="password" id="password" placeholder="Contraseña" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 p-2 border">
            </div>
            <button type="submit" class="btn-primary w-full">Ingresar</button>
        </form>
        <p id="login-message" class="mt-4 text-center text-red-500 font-medium"></p>
    </div>

    <!-- Pantalla Principal de Agendamiento de Citas -->
    <div id="main-app" class="hidden">
        <header class="flex justify-between items-center py-4 px-6 bg-white shadow-md rounded-lg">
            <div class="flex items-center">
                <h1 class="text-2xl font-bold text-gray-800">Sistema de Citas</h1>
                <p class="ml-4 text-gray-600">Bienvenido, <span id="user-name" class="font-semibold"></span></p>
            </div>
            <button id="logout-btn" class="text-sm text-gray-600 hover:text-red-500 transition-colors">Cerrar Sesión</button>
        </header>

        <div class="form-container">
            <h2 class="text-2xl font-bold text-gray-800 mb-6">Agendar Nueva Cita</h2>
            
            <!-- Step 1: Selección de Especialidad -->
            <div id="step-1" class="mb-8">
                <h3 class="text-xl font-semibold step-heading">1. Seleccionar Especialidad</h3>
                <div class="relative">
                    <select id="especialidad-select" class="block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 p-3 border">
                        <option value="">Selecciona una especialidad...</option>
                    </select>
                </div>
                <p id="step-1-message" class="mt-2 text-sm text-red-500"></p>
            </div>

            <!-- Step 2: Selección de Sede -->
            <div id="step-2" class="mb-8 hidden">
                <h3 class="text-xl font-semibold step-heading">2. Seleccionar Sede</h3>
                <div class="relative">
                    <select id="sede-select" class="block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 p-3 border">
                        <option value="">Selecciona una sede...</option>
                    </select>
                </div>
                <p id="step-2-message" class="mt-2 text-sm text-red-500"></p>
            </div>

            <!-- Step 3: Selección de Profesional -->
            <div id="step-3" class="mb-8 hidden">
                <h3 class="text-xl font-semibold step-heading">3. Seleccionar Profesional</h3>
                <div class="relative">
                    <select id="profesional-select" class="block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 p-3 border">
                        <option value="">Selecciona un profesional...</option>
                    </select>
                </div>
                <p id="step-3-message" class="mt-2 text-sm text-red-500"></p>
            </div>

            <!-- Step 4: Selección de Horario -->
            <div id="step-4" class="mb-8 hidden">
                <h3 class="text-xl font-semibold step-heading">4. Seleccionar Horario</h3>
                <div class="relative">
                    <input type="datetime-local" id="datetime-picker" class="block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 p-3 border">
                </div>
                <p id="step-4-message" class="mt-2 text-sm text-red-500"></p>
            </div>

            <!-- Resumen y Botón de Agendar -->
            <div id="step-5" class="mt-8 hidden">
                <h3 class="text-xl font-semibold step-heading">Resumen de la Cita</h3>
                <div id="cita-summary" class="bg-gray-100 p-6 rounded-lg text-gray-700 space-y-2">
                    <p><span class="font-semibold">Especialidad:</span> <span id="summary-especialidad"></span></p>
                    <p><span class="font-semibold">Sede:</span> <span id="summary-sede"></span></p>
                    <p><span class="font-semibold">Profesional:</span> <span id="summary-profesional"></span></p>
                    <p><span class="font-semibold">Fecha y Hora:</span> <span id="summary-datetime"></span></p>
                </div>
                <!-- Botones de Gemini API -->
                <div class="flex flex-col gap-3 mt-4">
                    <button id="get-gemini-info-btn" class="btn-secondary flex items-center justify-center gap-2">
                        <span id="gemini-info-loader" class="hidden loader"></span>
                        <span id="gemini-info-text">✨ Obtener información sobre la especialidad ✨</span>
                    </button>
                    <button id="get-gemini-tts-btn" class="btn-secondary flex items-center justify-center gap-2">
                        <span id="gemini-tts-loader" class="hidden loader"></span>
                        <span id="gemini-tts-text">✨ Escuchar resumen de la cita ✨</span>
                    </button>
                    <div id="gemini-info-container" class="mt-4 p-4 bg-blue-100 rounded-lg hidden">
                        <p id="gemini-info-content" class="text-gray-800 text-sm italic"></p>
                    </div>
                </div>
                <div class="mt-6 flex gap-4">
                    <button id="agendar-btn" class="btn-primary flex-1">Confirmar Cita</button>
                    <button id="cancelar-btn" class="btn-secondary flex-1">Cancelar</button>
                </div>
                <p id="final-message" class="mt-4 text-center text-sm font-medium"></p>
            </div>
        </div>

        <!-- Panel de Citas Agendadas (HU-09) -->
        <div class="form-container mt-8">
            <h2 class="text-2xl font-bold text-gray-800 mb-6">Mis Citas</h2>
            <div id="citas-list" class="space-y-4">
                <p id="no-citas-message" class="text-center text-gray-500 hidden">No tienes citas registradas.</p>
            </div>
        </div>
    </div>
</div>

<!-- Modal para confirmaciones y mensajes -->
<div id="custom-modal" class="modal-overlay hidden">
    <div class="modal-content">
        <p id="modal-message" class="text-lg text-gray-800"></p>
        <div class="modal-buttons" id="modal-buttons-container">
            <button id="modal-confirm-btn" class="btn-primary">Sí</button>
            <button id="modal-cancel-btn" class="btn-secondary">No</button>
        </div>
    </div>
</div>

            }

                const handleConfirm = () => {
                    modal.classList.add('hidden');
                    confirmBtn.removeEventListener('click', handleConfirm);
                    cancelBtn.removeEventListener('click', handleCancel);
                    resolve(true);
                };

                const handleCancel = () => {
                    modal.classList.add('hidden');

                    cancelBtn.removeEventListener('click', handleCancel);
                    resolve(false);

        // Simular la generación de horarios disponibles
        const generateHorarios = () => {
            const today = new Date();
            const tomorrow = new Date(today);
            tomorrow.setDate(tomorrow.getDate() + 1);

            for (let i = 0; i < 20; i++) { // Generar horarios para 20 días
                const date = new Date(tomorrow);
                date.setDate(date.getDate() + i);

                const dayOfWeek = date.getDay();
                if (dayOfWeek === 0 || dayOfWeek === 6) { // Omitir fines de semana
                    continue;
                }
                
                for (let prof of db.profesionales) {
                    const isAbsent = db.ausencias.some(a => {
                        const start = new Date(a.fecha_inicio);
                        const end = new Date(a.fecha_fin);
                        return a.id_profesional === prof.id && date >= start && date <= end;
                    });

                    if (isAbsent) continue;
                    
                    for (let hour = 8; hour <= 17; hour++) { // Horas de 8 AM a 5 PM
                        for (let minute = 0; minute < 60; minute += 30) { // 30 minutos de duración
                            const startTime = `${String(hour).padStart(2, '0')}:${String(minute).padStart(2, '0')}:00`;
                            lastHorarioId++;
                            db.horarios_disponibles.push({

                                id_profesional: prof.id,
                                fecha: date.toISOString().split('T')[0],

                        }
                    }
                }

        const logoutBtn = document.getElementById('logout-btn');

        const especialidadSelect = document.getElementById('especialidad-select');
        const sedeSelect = document.getElementById('sede-select');
        const profesionalSelect = document.getElementById('profesional-select');
        const datetimePicker = document.getElementById('datetime-picker');

        const step2Container = document.getElementById('step-2');
        const step3Container = document.getElementById('step-3');
        const step4Container = document.getElementById('step-4');
        const step5Container = document.getElementById('step-5');

        const summaryEspecialidad = document.getElementById('summary-especialidad');
        const summarySede = document.getElementById('summary-sede');
        const summaryProfesional = document.getElementById('summary-profesional');
        const summaryDatetime = document.getElementById('summary-datetime');
        const agendarBtn = document.getElementById('agendar-btn');
        const cancelarBtn = document.getElementById('cancelar-btn');
        const finalMessage = document.getElementById('final-message');
        const citasList = document.getElementById('citas-list');
        const noCitasMessage = document.getElementById('no-citas-message');

        const getGeminiInfoBtn = document.getElementById('get-gemini-info-btn');
        const geminiInfoLoader = document.getElementById('gemini-info-loader');
        const geminiInfoText = document.getElementById('gemini-info-text');
        const geminiInfoContainer = document.getElementById('gemini-info-container');
        const geminiInfoContent = document.getElementById('gemini-info-content');

        const getGeminiTtsBtn = document.getElementById('get-gemini-tts-btn');
        const geminiTtsLoader = document.getElementById('gemini-tts-loader');
        const geminiTtsText = document.getElementById('gemini-tts-text');

        let selected = {
            especialidadId: null,
            especialidadNombre: null,
            sedeId: null,
            sedeNombre: null,
            profesionalId: null,
            profesionalNombre: null,
            datetime: null,
            horarioId: null,
            profesionalSedeId: null,
        };

        // Inicializar datos y generar horarios
        generateHorarios();
        generateInitialCitas();

        // Manejar el inicio de sesión
        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const cedula = document.getElementById('cedula').value;
            const password = document.getElementById('password').value;

            const paciente = db.pacientes.find(p => p.contraseña === password);
            
            if (paciente) {
                loggedInPatient = paciente;
                userNameSpan.textContent = paciente.nombre_del_paciente;
                loginScreen.classList.add('hidden');
                mainApp.classList.remove('hidden');
                loadEspecialidades();
                loadCitas();
            } else {
                loginMessage.textContent = 'Credenciales inválidas, por favor intente de nuevo.';
                setTimeout(() => loginMessage.textContent = '', 3000);
            }
        });

        // Manejar el cierre de sesión
        logoutBtn.addEventListener('click', () => {
            loggedInPatient = null;
            selected = {};
            mainApp.classList.add('hidden');
            loginScreen.classList.remove('hidden');
            // Resetear formularios y vistas
            especialidadSelect.value = '';
            sedeSelect.innerHTML = '<option value="">Selecciona una sede...</option>';
            profesionalSelect.innerHTML = '<option value="">Selecciona un profesional...</option>';
            step2Container.classList.add('hidden');
            step3Container.classList.add('hidden');
            step4Container.classList.add('hidden');
            step5Container.classList.add('hidden');
            geminiInfoContainer.classList.add('hidden');
        });

        // Cargar especialidades al inicio
        const loadEspecialidades = async () => {
            const especialidades = await getEspecialidades();
            especialidadSelect.innerHTML = '<option value="">Selecciona una especialidad...</option>';
            especialidades.forEach(e => {
                const option = document.createElement('option');
                option.value = e.id;
                option.textContent = e.nombre;
                if (!e.disponible) {
                    option.disabled = true;
                    option.textContent += ' (Sin disponibilidad)';
                }
                especialidadSelect.appendChild(option);
            });
        };

        // Manejar el cambio de especialidad (HU-01)
        especialidadSelect.addEventListener('change', async (e) => {
            selected.especialidadId = e.target.value;
            selected.especialidadNombre = e.target.options[e.target.selectedIndex].textContent.replace(' (Sin disponibilidad)', '');
            
            // Resetear pasos siguientes
            step2Container.classList.add('hidden');
            step3Container.classList.add('hidden');
            step4Container.classList.add('hidden');
            step5Container.classList.add('hidden');
            geminiInfoContainer.classList.add('hidden');
            if (!selected.especialidadId) return;

            // Cargar sedes (HU-02)
            const sedes = await getSedesByEspecialidad(selected.especialidadId);
            sedeSelect.innerHTML = '<option value="">Selecciona una sede...</option>';
            sedes.forEach(s => {
                const option = document.createElement('option');
                option.value = s.id;
                option.textContent = `${s.nombre}, ${s.direccion}, ${s.ciudad}`;
                sedeSelect.appendChild(option);
            });
            step2Container.classList.remove('hidden');
        });

        // Manejar el cambio de sede (HU-02)
        sedeSelect.addEventListener('change', async (e) => {
            selected.sedeId = e.target.value;
            selected.sedeNombre = e.target.options[e.target.selectedIndex].textContent;
            
            // Resetear pasos siguientes
            step3Container.classList.add('hidden');
            step4Container.classList.add('hidden');
            step5Container.classList.add('hidden');
            geminiInfoContainer.classList.add('hidden');
            if (!selected.sedeId) return;

            // Cargar profesionales (HU-03)
            const profesionales = await getProfesionalesBySedeAndEspecialidad(selected.especialidadId, selected.sedeId);
            profesionalSelect.innerHTML = '<option value="">Selecciona un profesional...</option>';
            profesionales.forEach(p => {
                const option = document.createElement('option');
                option.value = p.id;
                option.textContent = `${p.nombre_completo} - ${p.titulo_profesional} (${p.anos_experiencia} años de experiencia)`;
                profesionalSelect.appendChild(option);
            });
            step3Container.classList.remove('hidden');
        });

        // Manejar el cambio de profesional (HU-03)
        profesionalSelect.addEventListener('change', async (e) => {
            selected.profesionalId = e.target.value;
            selected.profesionalNombre = e.target.options[e.target.selectedIndex].textContent;
            selected.profesionalSedeId = db.profesionales.find(p => p.id === parseInt(selected.profesionalId)).id_sede;
            
            // Resetear pasos siguientes
            step4Container.classList.add('hidden');
            step5Container.classList.add('hidden');
            geminiInfoContainer.classList.add('hidden');
            if (!selected.profesionalId) return;

            // Cargar horarios disponibles (HU-04)
            const horarios = await getHorariosByProfesional(selected.profesionalId, loggedInPatient.id);
            if (horarios.length > 0) {
                // Configurar el datetime-local con las opciones
                const primerHorario = new Date(`${horarios[0].fecha}T${horarios[0].hora_inicio}`);
                datetimePicker.min = primerHorario.toISOString().slice(0, 16);
                datetimePicker.value = '';
                datetimePicker.disabled = false;
                step4Container.classList.remove('hidden');
            } else {
                datetimePicker.disabled = true;
                document.getElementById('step-4-message').textContent = 'No hay horarios disponibles en los próximos 60 días.';
            }
        });

        // Manejar la selección de horario (HU-04)
        datetimePicker.addEventListener('change', (e) => {
            const selectedDate = new Date(e.target.value);
            const formattedDate = selectedDate.toLocaleDateString('es-CO', { year: 'numeric', month: 'long', day: 'numeric' });
            const formattedTime = selectedDate.toLocaleTimeString('es-CO', { hour: '2-digit', minute: '2-digit' });
            selected.datetime = `${formattedDate} a las ${formattedTime}`;

            const horarioEncontrado = db.horarios_disponibles.find(h => {
                const horarioDateTime = new Date(`${h.fecha}T${h.hora_inicio}`);
                return horarioDateTime.getTime() === selectedDate.getTime();
            });

            if (horarioEncontrado) {
                selected.horarioId = horarioEncontrado.id_horario;
                
                // Mostrar resumen (HU-05)
                summaryEspecialidad.textContent = selected.especialidadNombre;
                summarySede.textContent = selected.sedeNombre;
                summaryProfesional.textContent = selected.profesionalNombre;
                summaryDatetime.textContent = selected.datetime;
                step5Container.classList.remove('hidden');
            } else {
                // Horario no válido o ya ocupado
                selected.horarioId = null;
                step5Container.classList.add('hidden');
                document.getElementById('step-4-message').textContent = 'El horario seleccionado no es válido o ya está ocupado.';
            }
        });

        // Manejar el agendamiento (HU-05)
        agendarBtn.addEventListener('click', async () => {
            if (!selected.horarioId) {
                finalMessage.textContent = 'Por favor, selecciona un horario válido.';
                finalMessage.classList.add('text-red-500');
                return;
            }

            const resultado = await agendarCita(loggedInPatient.id, parseInt(selected.profesionalId), selected.horarioId);

            if (resultado.success) {
                finalMessage.textContent = resultado.message;
                finalMessage.classList.remove('text-red-500');
                finalMessage.classList.add('text-green-500');
                setTimeout(() => {
                    // Resetear el formulario para agendar una nueva cita
                    especialidadSelect.value = '';
                    sedeSelect.innerHTML = '<option value="">Selecciona una sede...</option>';
                    profesionalSelect.innerHTML = '<option value="">Selecciona un profesional...</option>';
                    datetimePicker.value = '';
                    step2Container.classList.add('hidden');
                    step3Container.classList.add('hidden');
                    step4Container.classList.add('hidden');
                    step5Container.classList.add('hidden');
                    finalMessage.textContent = '';
                    geminiInfoContainer.classList.add('hidden');
                    loadCitas(); // Actualizar la lista de citas
                }, 3000);
            } else {
                finalMessage.textContent = resultado.message;
                finalMessage.classList.remove('text-green-500');
                finalMessage.classList.add('text-red-500');
            }
        });
        
        // Manejar la cancelación del agendamiento (HU-05)
        cancelarBtn.addEventListener('click', async () => {
            const confirmed = await showModal("¿Está seguro de que no desea seguir con el agendamiento de la cita?", true);
            hideModal();
            if (confirmed) {
                finalMessage.textContent = 'Agendamiento de cita cancelado exitosamente';
                finalMessage.classList.remove('text-red-500');
                finalMessage.classList.add('text-gray-500');
                setTimeout(() => {
                    // Resetear el formulario
                    especialidadSelect.value = '';
                    sedeSelect.innerHTML = '<option value="">Selecciona una sede...</option>';
                    profesionalSelect.innerHTML = '<option value="">Selecciona un profesional...</option>';
                    datetimePicker.value = '';
                    step2Container.classList.add('hidden');
                    step3Container.classList.add('hidden');
                    step4Container.classList.add('hidden');
                    step5Container.classList.add('hidden');
                    finalMessage.textContent = '';
                    geminiInfoContainer.classList.add('hidden');
                }, 3000);
            }
        });

        // Cargar y mostrar citas del paciente (HU-09)
        const loadCitas = async () => {
            const citas = await getCitasPaciente(loggedInPatient.id);
            citasList.innerHTML = '';
            if (citas.length === 0) {
                noCitasMessage.classList.remove('hidden');
            } else {
                noCitasMessage.classList.add('hidden');
                citas.forEach(cita => {
                    const citaItem = document.createElement('div');
                    citaItem.className = 'bg-gray-50 p-4 rounded-lg border border-gray-200 shadow-sm';
                    citaItem.innerHTML = `
                        <p class="font-bold text-gray-800">${cita.especialidad}</p>
                        <p class="text-sm text-gray-600">${cita.profesional}</p>
                        <p class="text-sm text-gray-500">
                            <span class="font-semibold">Sede:</span> ${cita.sede} - 
                            <span class="font-semibold">Fecha:</span> ${cita.fecha} -
                            <span class="font-semibold">Hora:</span> ${cita.hora}
                        </p>
                        <p class="text-sm font-semibold mt-2">Estado: <span class="
                            ${cita.estado === 'Agendada' ? 'text-blue-600' :
                             cita.estado === 'Cancelada' ? 'text-red-600' : 'text-green-600'}">
                            ${cita.estado}
                        </span></p>
                    `;
                    citasList.appendChild(citaItem);
                });
            }
        };

        // --- Funcionalidades de la API de Gemini ---

        // Función para obtener información de la especialidad desde Gemini
        getGeminiInfoBtn.addEventListener('click', async () => {
            if (!selected.especialidadNombre) return;

            geminiInfoLoader.classList.remove('hidden');
            geminiInfoText.classList.add('hidden');
            getGeminiInfoBtn.disabled = true;

            try {
                const prompt = `Explica en un párrafo corto y fácil de entender qué hace un profesional de la especialidad de ${selected.especialidadNombre} y qué se puede esperar de la cita. No des consejos médicos.`;
                const payload = {
                    contents: [{ parts: [{ text: prompt }] }],
                    tools: [{ "google_search": {} }],
                    systemInstruction: {
                        parts: [{ text: "Actúa como un asistente de información médica amigable. Explica de manera sencilla roles y expectativas, sin dar diagnósticos ni recomendaciones." }]
                    },
                };
                const apiKey = ""; // If you want to use models other than gemini-2.5-flash-preview-05-20 or imagen-3.0-generate-002, provide an API key here. Otherwise, leave this as-is.
                const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-05-20:generateContent?key=${apiKey}`;

                const response = await fetch(apiUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const result = await response.json();
                const text = result.candidates?.[0]?.content?.parts?.[0]?.text;
                
                if (text) {
                    geminiInfoContent.textContent = text;
                    geminiInfoContainer.classList.remove('hidden');
                } else {
                    geminiInfoContent.textContent = 'No se pudo obtener la información. Intenta de nuevo más tarde.';
                    geminiInfoContainer.classList.remove('hidden');
                }
            } catch (error) {
                console.error('Error al llamar a la API de Gemini:', error);
                geminiInfoContent.textContent = 'Hubo un error al procesar la solicitud. Por favor, inténtalo de nuevo.';
                geminiInfoContainer.classList.remove('hidden');
            } finally {
                geminiInfoLoader.classList.add('hidden');
                geminiInfoText.classList.remove('hidden');
                getGeminiInfoBtn.disabled = false;
            }
        });

        // Función para la síntesis de voz del resumen de la cita
        getGeminiTtsBtn.addEventListener('click', async () => {
            const summaryText = `Tu cita ha sido agendada. Especialidad: ${selected.especialidadNombre}. Sede: ${selected.sedeNombre}. Profesional: ${selected.profesionalNombre}. Fecha y hora: ${selected.datetime}.`;

            geminiTtsLoader.classList.remove('hidden');
            geminiTtsText.classList.add('hidden');
            getGeminiTtsBtn.disabled = true;

            try {
                const payload = {
                    contents: [{
                        parts: [{ text: summaryText }]
                    }],
                    generationConfig: {
                        responseModalities: ["AUDIO"],
                        speechConfig: {
                            voiceConfig: {
                                prebuiltVoiceConfig: { voiceName: "Kore" }
                            }
                        }
                    },
                    model: "gemini-2.5-flash-preview-tts"
                };
                const apiKey = ""; // Leave as-is
                const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-tts:generateContent?key=${apiKey}`;

                const response = await fetch(apiUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const result = await response.json();
                const part = result?.candidates?.[0]?.content?.parts?.[0];
                const audioData = part?.inlineData?.data;
                const mimeType = part?.inlineData?.mimeType;

                if (audioData && mimeType && mimeType.startsWith("audio/")) {
                    const sampleRate = parseInt(mimeType.match(/rate=(\d+)/)[1], 10);
                    const pcmData = base64ToArrayBuffer(audioData);
                    const pcm16 = new Int16Array(pcmData);
                    const wavBlob = pcmToWav(pcm16, sampleRate);
                    const audioUrl = URL.createObjectURL(wavBlob);
                    
                    const audio = new Audio(audioUrl);
                    audio.play();
                } else {
                    console.error('No se recibieron datos de audio o el formato es incorrecto.');
                }
            } catch (error) {
                console.error('Error al llamar a la API de TTS:', error);
            } finally {
                geminiTtsLoader.classList.add('hidden');
                geminiTtsText.classList.remove('hidden');
                getGeminiTtsBtn.disabled = false;
            }
        });

        // Funciones de utilidad para convertir el audio PCM a WAV
        function base64ToArrayBuffer(base64) {
            const binaryString = atob(base64);
            const len = binaryString.length;
            const bytes = new Uint8Array(len);
            for (let i = 0; i < len; i++) {
                bytes[i] = binaryString.charCodeAt(i);
            }
            return bytes.buffer;
        }

        function pcmToWav(pcm16, sampleRate) {
            const buffer = new ArrayBuffer(44 + pcm16.length * 2);
            const view = new DataView(buffer);
            
            // RIFF identifier
            writeString(view, 0, 'RIFF');
            // file length
            view.setUint32(4, 36 + pcm16.length * 2, true);
            // RIFF type
            writeString(view, 8, 'WAVE');
            // format chunk identifier
            writeString(view, 12, 'fmt ');
            // format chunk length
            view.setUint32(16, 16, true);
            // sample format (raw)
            view.setUint16(20, 1, true);
            // channel count
            view.setUint16(22, 1, true);
            // sample rate
            view.setUint32(24, sampleRate, true);
            // byte rate (sample rate * block align)
            view.setUint32(28, sampleRate * 2, true);
            // block align (channel count * bytes per sample)
            view.setUint16(32, 2, true);
            // bits per sample
            view.setUint16(34, 16, true);
            // data chunk identifier
            writeString(view, 36, 'data');
            // data chunk length
            view.setUint32(40, pcm16.length * 2, true);
            
            // write the PCM samples
            let offset = 44;
            for (let i = 0; i < pcm16.length; i++) {
                view.setInt16(offset, pcm16[i], true);
                offset += 2;
            }
            
            return new Blob([view], { type: 'audio/wav' });
        }

        function writeString(view, offset, string) {
            for (let i = 0; i < string.length; i++) {
                view.setUint8(offset + i, string.charCodeAt(i));
            }
        }
    });
</script>
